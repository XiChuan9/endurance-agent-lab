name: Bug report
description: Report a reproducible framework, CLI, packaging, or evaluation defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach private athlete data, API keys, or raw activity exports.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact commands and a synthetic/minimized input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed athlete identities, credentials, and private records.
          required: true
