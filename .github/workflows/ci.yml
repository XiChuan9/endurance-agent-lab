name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate public contracts
        run: eal validate

      - name: Run tests with coverage gate
        run: pytest --cov=endurance_agent_lab --cov-report=term-missing

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy src/endurance_agent_lab

      - name: Run zero-cost end-to-end regression
        run: eal demo --clean

      - name: Build distributable wheel
        run: python -m build

      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -m venv /tmp/eal-wheel-smoke
          /tmp/eal-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/eal-wheel-smoke/bin/pip install dist/endurance_agent_lab-*.whl
          (
            cd /tmp
            /tmp/eal-wheel-smoke/bin/eal doctor
            /tmp/eal-wheel-smoke/bin/eal validate
          )
