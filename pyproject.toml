[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endurance-agent-lab"
version = "0.1.1"
description = "Open-source evaluation and engineering framework for reliable AI endurance-coaching agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "XiChuan9" }
]
keywords = [
  "agent-evals",
  "endurance-training",
  "running",
  "ai-coach",
  "codex-skills",
  "benchmark",
  "openai"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Testing"
]
dependencies = [
  "jinja2>=3.1,<4",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "rich>=13.7,<16",
  "typer>=0.16,<1"
]

[project.optional-dependencies]
openai = ["openai>=1.99,<3"]
dev = [
  "build>=1.5,<2",
  "mypy>=2.0,<3",
  "openai>=1.99,<3",
  "pre-commit>=4.6,<5",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.16,<1",
  "types-PyYAML>=6.0"
]
all = [
  "openai>=1.99,<3",
  "build>=1.5,<2",
  "mypy>=2.0,<3",
  "pre-commit>=4.6,<5",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.16,<1",
  "types-PyYAML>=6.0"
]

[project.scripts]
eal = "endurance_agent_lab.cli:app"

[project.urls]
Homepage = "https://github.com/XiChuan9/endurance-agent-lab"
Repository = "https://github.com/XiChuan9/endurance-agent-lab"
Issues = "https://github.com/XiChuan9/endurance-agent-lab/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
endurance_agent_lab = ["rendering/templates/*.j2"]

[tool.setuptools.data-files]
"share/endurance-agent-lab/config" = ["config/default.yaml"]
"share/endurance-agent-lab/benchmarks/endurancebench-v0.1" = [
  "benchmarks/endurancebench-v0.1/manifest.yaml"
]
"share/endurance-agent-lab/benchmarks/endurancebench-v0.1/cases" = [
  "benchmarks/endurancebench-v0.1/cases/*.yaml"
]
"share/endurance-agent-lab/skills/training-plan-auditor" = [
  "skills/training-plan-auditor/SKILL.md"
]
"share/endurance-agent-lab/skills/training-plan-auditor/references" = [
  "skills/training-plan-auditor/references/*.md"
]
"share/endurance-agent-lab/skills/training-plan-auditor/scripts" = [
  "skills/training-plan-auditor/scripts/*.py"
]
"share/endurance-agent-lab/skills/training-plan-auditor/assets" = [
  "skills/training-plan-auditor/assets/*.json"
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["runs", "private"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["runs", "private"]

[tool.coverage.run]
branch = true
source = ["endurance_agent_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
